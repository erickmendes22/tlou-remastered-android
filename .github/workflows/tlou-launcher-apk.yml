name: TLOU v0.4 installer and launcher APK

on:
  # Manual legacy path only: full native workflow owns CPU/GPU ABI changes.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tlou-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TLOU_JOBS: '3'
      TLOU_ANDROID_API: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test automatic preparation and failure recovery
        run: python3 -m unittest discover -s android/tests -v
      - name: Test service contracts including base TLOU Remote Play query
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -I gow3_pc -I gow3_pc/src gow3_pc/tests/test_services.c -o "$RUNNER_TEMP/tlou-services-test"
          "$RUNNER_TEMP/tlou-services-test"
      - name: Verify unchanged GPU and FEX inputs; allow only the services relink
        run: |
          git diff --exit-code 67bf61c2ccce5193e5cc3abeb72e38dba0f0b11a HEAD -- gow3_pc ci android/bionic/build_deps.sh android/bionic/build_fex.sh android/bionic/build_gpu.sh android/bionic/build_runtime.sh ':!gow3_pc/src/runtime_services.c' ':!gow3_pc/src/import_names.inc' ':!gow3_pc/tests/test_services.c'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - name: Set NDK path
        run: echo "TLOU_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile launcher and lint release
        run: gradle -p android-launcher :app:compileReleaseJavaWithJavac :app:lintVitalRelease --no-daemon --max-workers=2
      - name: Reuse verified native runtime from successful build
        uses: actions/download-artifact@v4
        with:
          name: TLOU-Bionic-native-arm64
          path: out/android-bionic
          github-token: ${{ github.token }}
          run-id: 41502314852
      - name: Restore matching Bionic link dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
            .local-deps/android/bionic-build
            .local-deps/FEX
            ~/.cache/ccache
          key: tlou-bionic-arm64-v2-${{ runner.os }}-${{ hashFiles('android/bionic/build_deps.sh', 'android/bionic/build_fex.sh') }}
      - name: Rebuild runtime with base TLOU service implementation
        run: |
          git submodule update --init gow3_pc/third_party/LibAtrac9
          bash android/bionic/build_deps.sh
          bash android/bionic/build_runtime.sh --link-only
      - name: Restore Python and Rust compiler caches
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/bionic-src/python-3.13.7
            .local-deps/android/bionic-build/python-host-isolated-v1
            .local-deps/android/bionic-build/python-android-isolated-v1
            out/android-bionic/python
            out/android-bionic/orbis-cargo
            ~/.cargo/registry
            ~/.cargo/git
          key: tlou-install-tools-v1-${{ hashFiles('android/bionic/build_python.sh', 'android/bionic/build_pkg.sh') }}
      - name: Build Bionic Python and PKG extractor
        run: |
          bash android/bionic/build_python.sh
          bash android/bionic/build_pkg.sh
      - name: Validate native binaries
        run: python3 android/bionic/verify_bionic.py --ndk "$TLOU_NDK" --root out/android-bionic
      - name: Cache experimental signing identity
        uses: actions/cache@v4
        with:
          path: out/android-bionic/experimental-development.jks
          key: tlou-development-signing-v2
      - name: Package installer, preparer, drivers UI and native runtime
        run: bash android/bionic/package_apk.sh
      - name: Verify installation payload
        run: python3 android/bionic/check_tools_apk.py out/release/TheLastOfUsRemastered-Android-Bionic-v0.4-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TheLastOfUsRemastered-Android-v0.4-arm64
          path: |
            out/release/TheLastOfUsRemastered-Android-Bionic-v0.4-arm64.apk
            out/release/TheLastOfUsRemastered-Android-Bionic-v0.4-arm64.apk.sha256
          if-no-files-found: error
      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-installer-build-diagnostics
          path: |
            .local-deps/android/bionic-build/**/*.log
            android-launcher/app/build/reports/**
          if-no-files-found: ignore

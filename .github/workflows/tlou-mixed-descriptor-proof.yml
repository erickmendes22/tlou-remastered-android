name: TLOU Mixed Descriptor Exact Vulkan Proof

on:
  push:
    branches: [experiment/tlou-mixed-descriptor-proof-20261114]
    paths:
      - '.github/workflows/tlou-mixed-descriptor-proof.yml'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/tlou_mixed_descriptor_template.h'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_common.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_pipeline_common.h'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_graphics_pipeline.cpp'
      - 'gow3_pc/tests/test_tlou_mixed_descriptor_template.cpp'
      - 'gow3_pc/tests/test_tlou_mixed_descriptor_vulkan.cpp'
      - 'gow3_pc/tests/shaders/tlou_mixed_descriptor.comp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-descriptor-proof:
    name: Mixed sampled-image pixel and timing proof
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa Vulkan software ICD, validation and GLSL compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools
      - name: Build and run layout/payload/fallback checks under sanitizers
        run: |
          set -euo pipefail
          mkdir -p out/tlou-mixed-proof
          c++ -std=c++20 -O1 -g -UNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_mixed_descriptor_template.cpp -o out/tlou-mixed-proof/guards
          out/tlou-mixed-proof/guards
      - name: Build real Vulkan changing-pixel test
        run: |
          set -euo pipefail
          glslangValidator -V gow3_pc/tests/shaders/tlou_mixed_descriptor.comp -o out/tlou-mixed-proof/mixed.spv
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-unknown-pragmas -Wno-unused-value -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_mixed_descriptor_vulkan.cpp -lvulkan -o out/tlou-mixed-proof/vulkan-test
      - name: Validate 128 exact GPU outputs and compare driver recording cost
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$VK_ICD_FILENAMES"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT out/tlou-mixed-proof/vulkan-test out/tlou-mixed-proof/mixed.spv | tee out/tlou-mixed-proof/report.txt
          grep -q 'sampled image+sampler+buffers PASS' out/tlou-mixed-proof/report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TLOU-Mixed-Descriptor-Proof-${{ matrix.runner }}
          path: out/tlou-mixed-proof/report.txt
          if-no-files-found: warn

name: TLOU Android source checks

on:
  push:
    paths:
      - 'android/**'
      - 'tools/probe_tlou.py'
      - '.github/workflows/android-source-checks.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/probe_tlou.py'
      - '.github/workflows/android-source-checks.yml'

permissions:
  contents: read

jobs:
  game-preparation-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python3 -m compileall -q android
      - name: Test SFO title guards and read-only update overlay
        run: python3 -m unittest discover -s android/tests -v

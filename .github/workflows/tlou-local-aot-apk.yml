name: TLOU Experimental Local AOT APK

on:
  push:
    branches: [experiment/tlou-local-aot-20261112, perf/tlou-aot-next-20261113, perf/tlou-buffer-template-20261114, experiment/tlou-compute-descriptor-reuse-20261114]
    paths:
      # Only release a new APK when its actual patched compiler artifact is
      # pinned below; source edits/tests must not publish an unusable image.
      - 'android/aot/port_runtime.py'
      - 'android/aot/patch_recompiler_tso_one_fence.py'
      - 'android/aot/patch_recompiler_tso.py'
      - 'android/aot/patch_recompiler_vpcmpistrx.py'
      - 'android/aot/build_recompiler_tso.sh'
      - 'android/aot/test_tso_one_fence.py'
      - 'android/aot/affinity_name_interpose.cpp'
      - 'android/aot/test_affinity_preload.py'
      - 'android/aot/test_affinity_balance_model.py'
      - 'android/aot/aot_local.py'
      - 'android/aot/test_aot_local.py'
      - 'android/aot/test_aot_quality.py'
      - 'android/aot/test_fiber_tls.py'
      - 'android/aot/test_aot_fault_probe.py'
      - 'android/aot/test_aot_signal_stack.py'
      - 'android/aot/test_aot_host_stack.py'
      - 'android/bionic/build_aot_cpu.sh'
      - 'android/bionic/repackage_local_aot.py'
      - 'android/bionic/stage_aot_compiler.sh'
      - 'android-launcher/**'
      - 'gow3_pc/gpu/**'
      - 'gow3_pc/gpu/shadps4/video_core/amdgpu/liverpool.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/renderer_vulkan/tlou_compute_drain_policy.h'
      - 'gow3_pc/tests/test_tlou_compute_drain_policy.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/buffer_cache/buffer_cache.cpp'
      - 'gow3_pc/gpu/shadps4/video_core/buffer_cache/buffer_cache.h'
      - 'gow3_pc/gpu/shadps4/video_core/buffer_cache/tlou_readback_watch_gate.h'
      - 'gow3_pc/tests/test_tlou_readback_watch_gate.cpp'
      - 'gow3_pc/src/android_cpu_policy.h'
      - 'gow3_pc/tests/test_android_cpu_policy.c'
      - '.github/workflows/tlou-local-aot-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tlou-aotnative-apk-stable-signature
  cancel-in-progress: true

jobs:
  descriptor-proof:
    name: Exact descriptor payloads and native Vulkan cost
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install real software Vulkan and shader compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools
      - name: Validate every fallback and changing descriptor payload
        run: |
          set -euo pipefail
          mkdir -p out/descriptor-proof
          c++ -std=c++20 -O1 -g -UNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_buffer_descriptor_template.cpp -o out/descriptor-proof/guards
          out/descriptor-proof/guards
          c++ -std=c++20 -O1 -g -UNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_compute_descriptor_reuse.cpp -o out/descriptor-proof/reuse-guards
          out/descriptor-proof/reuse-guards
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-unknown-pragmas -Wno-unused-value -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_buffer_descriptor_hpp.cpp -o out/descriptor-proof/hpp
          out/descriptor-proof/hpp
          python3 gow3_pc/tests/build_tlou_buffer_descriptor_shaders.py out/descriptor-proof/shaders
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -Wno-missing-field-initializers -Wno-unknown-pragmas -Wno-unused-value -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_buffer_descriptor_vulkan.cpp -lvulkan -o out/descriptor-proof/vulkan-test
      - name: GPU output equality with validation and alternating benchmark
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$VK_ICD_FILENAMES"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT out/descriptor-proof/vulkan-test out/descriptor-proof/shaders --correctness-only > out/descriptor-proof/validation.txt 2>&1
          cat out/descriptor-proof/validation.txt
          if grep -E 'Validation Error|VUID-|SYNC-HAZARD' out/descriptor-proof/validation.txt; then exit 1; fi
          out/descriptor-proof/vulkan-test out/descriptor-proof/shaders --reuse-only | tee out/descriptor-proof/cost.txt
          grep -q 'COMPUTE REUSE real Vulkan' out/descriptor-proof/cost.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TLOU-buffer-template-proof-${{ matrix.runner }}
          path: out/descriptor-proof/*.txt
          if-no-files-found: warn
  gpu:
    needs: descriptor-proof
    name: Cross-compile optimized Bionic TLOU Vulkan renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TLOU_JOBS: '3'
      TLOU_ANDROID_API: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test readback watch, compute waits and restored native shader optimizations
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -pthread gow3_pc/tests/test_tlou_host_copy_wait.cpp -o /tmp/tlou-test-host-copy-wait
          /tmp/tlou-test-host-copy-wait
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -pthread -I gow3_pc/gpu/shim gow3_pc/tests/test_tlou_host_copy_batch.cpp -o /tmp/tlou-test-host-copy-batch
          /tmp/tlou-test-host-copy-batch --correctness-only
          /tmp/tlou-test-host-copy-batch
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror gow3_pc/tests/test_tlou_readback_watch_gate.cpp -o /tmp/tlou-test-readback-gate
          /tmp/tlou-test-readback-gate
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_compute_drain_policy.cpp -o /tmp/tlou-test-compute-wait-defer
          /tmp/tlou-test-compute-wait-defer
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_adpf_thread_set.cpp -o /tmp/tlou-test-adpf
          /tmp/tlou-test-adpf
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_pending_granule_filter.cpp -o /tmp/tlou-test-filter
          /tmp/tlou-test-filter --correctness-only
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Restore native dependencies and incremental compiler cache
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
            .local-deps/android/bionic-build
            .local-deps/FEX
            ~/.cache/ccache
          key: tlou-bionic-arm64-v2-${{ runner.os }}-${{ hashFiles('android/bionic/build_deps.sh', 'android/bionic/build_fex.sh') }}
      - name: Cross-compile host utilities
        shell: bash -el {0}
        run: |
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          echo "TLOU_BIONIC_HEADERS=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "TLOU_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Restore pinned Android Bionic libraries (cached when available)
        shell: bash -el {0}
        run: bash android/bionic/build_deps.sh
      - name: Configure updated GPU renderer with current source
        shell: bash -el {0}
        run: bash android/bionic/build_gpu.sh --configure-only
      - name: Compile REAL libgow3gpu.so including restored shader-specialization code
        shell: bash -el {0}
        run: bash android/bionic/build_gpu.sh
      - name: Verify AArch64 and save separately hashed native GPU artifact
        run: |
          set -euo pipefail
          mkdir -p out/native-gpu
          cp out/android-bionic/lib/libgow3gpu.so out/native-gpu/libgow3gpu.so
          readelf -h out/native-gpu/libgow3gpu.so | grep -E 'Machine:.*AArch64'
          grep -aFq 'memory-waits-deferred=' out/native-gpu/libgow3gpu.so
          grep -aFq 'TLOU compute buffer-only fast' out/native-gpu/libgow3gpu.so
          grep -aFq 'TLOU pending word-hit' out/native-gpu/libgow3gpu.so
          readelf -d out/native-gpu/libgow3gpu.so | grep NEEDED
          (cd out/native-gpu && sha256sum libgow3gpu.so > libgow3gpu.so.sha256 && sha256sum -c libgow3gpu.so.sha256)
          test $(stat -c %s out/native-gpu/libgow3gpu.so) -gt 100000
      - name: Publish exact source-built optimized GPU for AOT APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-AOT-Bionic-Optimized-GPU
          path: out/native-gpu/libgow3gpu.so*
          if-no-files-found: error
      - name: Upload native compiler errors on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-AOT-Native-GPU-Errors
          path: |
            out/android-bionic/gpu/CMakeFiles/CMakeConfigureLog.yaml
            out/android-bionic/gpu/CMakeCache.txt
          if-no-files-found: ignore

  apk:
    needs: gpu
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865'
      - name: Check local ARM64 AOT preparation
        run: |
          python3 -m py_compile android/aot/aot_local.py android/aot/test_aot_local.py android/aot/test_aot_quality.py android/bionic/repackage_local_aot.py android/aot/port_runtime.py
          python3 android/aot/test_aot_local.py -v
          python3 android/aot/test_aot_quality.py -v
          python3 android/aot/test_fiber_tls.py -v
          python3 android/aot/test_aot_fault_probe.py -v
          python3 android/aot/test_aot_signal_stack.py -v
          python3 android/aot/test_aot_host_stack.py -v
          python3 android/aot/test_affinity_preload.py -v
          python3 android/aot/test_affinity_balance_model.py -v
          python3 android/aot/test_tso_one_fence.py -v
          cc -std=gnu11 -O2 -pthread -Wall -Wextra -Werror gow3_pc/tests/test_android_cpu_policy.c -o /tmp/tlou-test-cpu-placement
          /tmp/tlou-test-cpu-placement
          c++ -std=c++20 -O2 -Wall -Wextra -Werror gow3_pc/tests/test_tlou_readback_watch_gate.cpp -o /tmp/tlou-test-readback-gate
          /tmp/tlou-test-readback-gate
          c++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -I gow3_pc/gpu/shadps4 gow3_pc/tests/test_tlou_compute_drain_policy.cpp -o /tmp/tlou-test-compute-wait-defer
          /tmp/tlou-test-compute-wait-defer
          mkdir -p out/aot-java-test
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouApp0Assets.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/TlouApp0AssetsTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.TlouApp0AssetsTest
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/UpdateInPlace.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/UpdateInPlaceTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.UpdateInPlaceTest
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/RuntimeProcess.java android-launcher/app/src/main/java/ro/cobrabm/fexdroid/TlouCpuThreads.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/TlouCpuThreadsTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.TlouCpuThreadsTest
          javac -d out/aot-java-test android-launcher/app/src/main/java/ro/cobrabm/fexdroid/AotInstrumentation.java android-launcher/app/src/test/java/ro/cobrabm/fexdroid/AotInstrumentationTest.java
          java -cp out/aot-java-test ro.cobrabm.fexdroid.AotInstrumentationTest
      - name: Retrieve successful native ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: TheLastOfUsRemastered-Android-v0.1.1-arm64
          path: out/aot-source-apk
          run-id: '43315820944'
          github-token: ${{ github.token }}
      - name: Build ARM64 AOT CPU from the current source, including TLOU fiber changes
        env:
          TLOU_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: bash android/bionic/build_aot_cpu.sh
      - name: Stage verified alternative AOT CPU, leave production FEX intact
        run: |
          set -euo pipefail
          so=out/android-bionic/aot-backend/libgow3cpu.so
          test -s "$so"
          python3 - "$so" <<'PY'
          import hashlib,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          expected=Path(str(path)+'.sha256').read_text().split()[0]
          assert hashlib.file_digest(path.open('rb'),'sha256').hexdigest()==expected
          PY
          readelf -h "$so" | grep -E 'Machine:.*AArch64'
          readelf --dyn-syms --wide "$so" | grep -F 'pthread_attr_setstacksize'
          grep -aFq 'TLOU AOT host pthread stack' "$so"
          readelf --dyn-syms --wide "$so" | grep -F pthread_setname_np
          grep -aFq 'TLOU CPU placement:' "$so"
          readelf --dyn-syms --wide "$so" | grep -F guest_cpu_fiber_switch
          grep -aFq 'TLOU AOT invalid target' "$so"   # ensure the current traced dispatcher is actually packaged
          grep -aFq 'TLOU AOT fiber TLS preserved' "$so" # ensure cross-thread TLS fix is linked
          readelf -Ws "$so" | grep -Fq 'TlouAotProbeFault' # the compiler may fold the write(2) string
          grep -aFq 'TLOU AOT sceFiberRun' "$so" # require fiber return-code provenance in packaged CPU engine
          grep -aFq 'TLOU AOT job thread entry' "$so" # thread-type and actual TLS provenance
          grep -aFq 'TLOU AOT queue lane' "$so" # confirm the failing queue record is captured
          mkdir -p out/android-bionic/apk-assets/runtime-aot
          cp "$so" out/android-bionic/apk-assets/runtime-aot/libgow3cpu.so
          test -s out/android-bionic/aot-backend/libbbcpu.so
          readelf -d out/android-bionic/aot-backend/libbbcpu.so | grep -F '[libgow3cpu.so]'
          cp out/android-bionic/aot-backend/libbbcpu.so out/android-bionic/apk-assets/runtime-aot/libbbcpu.so
      - name: Retrieve validated 3-tlou-string ARM64 compiler (rollback from v4)
        uses: actions/download-artifact@v4
        with:
          name: TLOU-bb-recomp-1.3.0-TSO-STR-ARM64
          path: out/aot-tso-compiler
          run-id: '43347558246'
          github-token: ${{ github.token }}
      - name: Verify pinned v3 compiler archive and ARM64 ABI
        run: |
          set -euo pipefail
          archive=out/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz
          test -s "$archive"
          echo 'fed33b282195034ce0da405b3ad60f513451786c6fda59767344cbedb219e7c0  '"$archive" | sha256sum -c
          (cd out/aot-tso-compiler && sha256sum -c bb-recomp-android-aarch64.tar.xz.sha256)
          mkdir -p out/aot-tso-extract
          tar -xJf "$archive" -C out/aot-tso-extract
          test -s out/aot-tso-extract/android/libbbrecomp.so
          test -s out/aot-tso-extract/android/bundle/libbbcpu-stub.so
          readelf -h out/aot-tso-extract/android/libbbrecomp.so | grep -E 'Machine:.*AArch64'
          grep -aFq '3-tlou-string' out/aot-tso-extract/android/libbbrecomp.so
      - name: Stage exact native game runtime with pinned ARM64 compiler
        run: |
          set -euo pipefail
          apk=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import hashlib,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          expected=Path(str(path)+'.sha256').read_text().split()[0].lower()
          with path.open('rb') as f:
              digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest==expected, f'Native APK SHA mismatch: {digest} != {expected}'
          print('Pinned native APK digest matched')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          export TLOU_TSO_REQUIRED=1
          export TLOU_AOT_COMPILER_ARCHIVE="$PWD/out/aot-tso-compiler/bb-recomp-android-aarch64.tar.xz"
          bash android/bionic/stage_aot_compiler.sh
          python3 android/bionic/repackage_local_aot.py "$apk"
      - name: Fetch GPU library compiled from current optimized renderer
        uses: actions/download-artifact@v4
        with:
          name: TLOU-AOT-Bionic-Optimized-GPU
          path: out/native-gpu
      - name: Replace old pinned libgow3gpu.so in AOT APK staging (keep same package and signing key)
        run: |
          set -euo pipefail
          (cd out/native-gpu && sha256sum -c libgow3gpu.so.sha256)
          original=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          python3 - "$original" <<'PY'
          from pathlib import Path
          import hashlib,sys,zipfile
          new=Path('out/native-gpu/libgow3gpu.so').read_bytes()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              old=archive.read('lib/arm64-v8a/libgow3gpu.so')
          assert new[:4]==b'\x7fELF' and len(new)>100000, 'GPU is not a real ELF'
          assert hashlib.sha256(new).digest()!=hashlib.sha256(old).digest(), 'GPU binary did not change: refuse pointless APK'
          print('Verified changed Bionic GPU:', hashlib.sha256(old).hexdigest()[:16], '->',hashlib.sha256(new).hexdigest()[:16])
          PY
          readelf -h out/native-gpu/libgow3gpu.so | grep -E 'Machine:.*AArch64'
          grep -aFq 'memory-waits-deferred=' out/native-gpu/libgow3gpu.so
          grep -aFq 'TLOU compute buffer-only fast' out/native-gpu/libgow3gpu.so
          grep -aFq 'TLOU pending word-hit' out/native-gpu/libgow3gpu.so
          cp out/native-gpu/libgow3gpu.so out/android-bionic/apk-jni/arm64-v8a/libgow3gpu.so
      - name: Generate save-selection fixtures for existing Android tests
        run: python3 gow3_pc/tests/test_android_save_choice.py
      - name: Restore pinned AOT v2 signing key (reused on future APKs)
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: tlou-aotnative-development-signing-v1
          fail-on-cache-miss: true
      - name: Verify pinned AOT v2 certificate before build
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          expected=adbdd4efd7cb981ce6a30303de83b635800b0960c68276d9247962918cc7328c
          actual=$(keytool -exportcert -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Debug signer mismatch: this APK would NOT update the AOT v2 experimental app. Refusing build. Found $actual" >&2
            exit 1
          fi
          echo "Pinned AOT signer verified: $actual"
      - name: Build standalone signed debug APK for local AOT compiler testing
        run: gradle -p android-launcher :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify signed APK, unchanged FEX/CPU and ACTUAL newly built GPU
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          apk=android-launcher/app/build/outputs/apk/debug/app-debug.apk
          original=out/aot-source-apk/TheLastOfUsRemastered-Android-v0.1.1-arm64.apk
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/apksigner" verify --print-certs "$apk" | grep -F 'adbdd4efd7cb981ce6a30303de83b635800b0960c68276d9247962918cc7328c'
          "$sdk/aapt" dump badging "$apk" | grep "package: name='com.daedalus.tlou.remastered.aotnative2'"
          python3 android/bionic/check_tools_apk.py "$apk"
          python3 - "$original" "$apk" <<'PY'
          import sys,zipfile,hashlib,io
          with zipfile.ZipFile(sys.argv[1]) as a, zipfile.ZipFile(sys.argv[2]) as b:
              preserved=[n for n in a.namelist() if n.startswith(('lib/arm64-v8a/','assets/runtime/','assets/drivers/')) and not n.endswith('/')]
              assert preserved
              new_gpu=b.read('lib/arm64-v8a/libgow3gpu.so')
              intended=open('out/native-gpu/libgow3gpu.so','rb').read()
              assert new_gpu==intended, 'new GPU not packaged: refusing old renderer'
              assert b'memory-waits-deferred=' in new_gpu, 'Compute memory-wait regression is still in APK'
              assert b'TLOU compute buffer-only fast' in new_gpu, 'Native compute specialization missing from APK'
              assert b'TLOU pending word-hit' in new_gpu, 'Native pending filter missing from APK'
              assert new_gpu!=a.read('lib/arm64-v8a/libgow3gpu.so'), 'old native GPU still packaged'
              for n in preserved:
                  if n=='lib/arm64-v8a/libgow3gpu.so': continue
                  assert hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest(),n
              assert b.getinfo('assets/runtime-aot/libgow3cpu.so').file_size>4096
              assert b.getinfo('assets/runtime-aot/libbbcpu.so').file_size>=512
              with zipfile.ZipFile(io.BytesIO(b.read('assets/tools.zip'))) as tools:
                  for n in ['bin/libbbrecomp.so','source/android/aot/aot_local.py','aot/upstream.sha256']:
                      assert tools.getinfo(n).file_size>0
                  aot_source=tools.read('source/android/aot/aot_local.py')
                  assert b'--no-callee-saved' in aot_source, 'fiber-safe ARM64 recompilation flags not packaged'
                  assert b'reload_after_calls_for_fibers' in aot_source, 'fiber-safe compiler metadata not packaged'
                  compiler=tools.read('bin/libbbrecomp.so')
                  assert tools.read('aot/upstream.sha256').strip()==b'fed33b282195034ce0da405b3ad60f513451786c6fda59767344cbedb219e7c0', 'wrong compiler archive'
                  assert b'3-tlou-string' in compiler, 'TSO v3 compiler missing: no APK can be published'
                  assert b'--no-dirty-check' in compiler, 'AOT compiler lacks immutable-unit optimization'
                  assert b'-O2' in compiler, 'AOT compiler lacks LLVM O2'
                  assert b'tlou-111-static-llvmO2-immutable-v1' in aot_source, 'AOT fast codegen profile not packaged'
                  assert b'if version != "3-tlou-string"' in aot_source, 'AOT v3 codegen adapter missing'
              print('Verified',len(preserved)-1,'unchanged native/runtime/driver files; new GPU rebuilt and AOT compiler pinned')
          PY
      - name: Publish installable experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-v011-ARM64-AOT-GPU-FullNativePerf-Restore-APK
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload diagnostics when compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TLOU-Local-AOT-APK-Errors
          path: android-launcher/app/build/reports/**
          if-no-files-found: ignore
